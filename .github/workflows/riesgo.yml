# P-03 · Auditoría basada en riesgo — declarado en el PR vs calculado sobre el diff real.
#
# Mismo modelo de confianza que paralelo.yml (P-05): evento pull_request_target y TODO
# lo que se ejecuta sale de un checkout de la revisión ACTUAL de origin/main, nunca del
# PR ni de su base. El PR aporta como DATOS su número, su HEAD, su base y su cuerpo
# (leído por API en el momento, no del evento: un `edited` posterior no deja vivo un
# veredicto viejo). No se ejecuta código del PR: solo `git diff` sobre sus commits.
# Un PR que cambie risk.mjs, risk.lib.mjs, paralelo.sh (GATES_RE) o este archivo se
# clasifica con la versión de main: no puede rebajarse a sí mismo.
#
# Publica el check-run "riesgo" sobre el HEAD del PR (en pull_request_target el check
# del job cuelga del sha de la base). Sin secretos; GH_TOKEN solo en los pasos que
# consultan la API o publican; permisos de escritura SOLO sobre checks.
#
# Límite: entra en vigor cuando este archivo está en main; en el PR que lo introduce no
# corre (a propósito, sin fallback al script del PR). Es un chequeo, no un candado: la
# protección de rama de main (required checks) sigue pendiente de Fer.
name: riesgo
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  checks: write
  pull-requests: read
concurrency:
  group: riesgo-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  riesgo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Revisión actual de main + PR como datos (HEAD, base y cuerpo por API)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_EVT: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin main
          git checkout -q --detach origin/main
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          HEAD_SHA=$(jq -r .head.sha "$RUNNER_TEMP/pr.json"); BASE_REF=$(jq -r .base.ref "$RUNNER_TEMP/pr.json")
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/cuerpo.md"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          if [ "$HEAD_SHA" != "$HEAD_EVT" ]; then
            echo "::warning title=riesgo::el HEAD del PR avanzó ($HEAD_EVT → $HEAD_SHA); se evalúa el actual"
          fi
          git fetch -q origin "refs/pull/$PR/head" "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git cat-file -e "$HEAD_SHA^{commit}"   # el HEAD leído por API tiene que estar traído
          echo "BASE_SHA=$(git rev-parse "origin/$BASE_REF")" >> "$GITHUB_ENV"
          echo "scripts de main=$(git rev-parse HEAD) · pr=#$PR head=$HEAD_SHA base=$BASE_REF"
      - name: Riesgo declarado vs calculado (P-03)
        run: |
          set +e
          OUT=$(node scripts/collab/risk.mjs verificar "$BASE_SHA" "$HEAD_SHA" "$RUNNER_TEMP/cuerpo.md" 2>&1); RC=$?
          set -e
          echo "$OUT"
          printf '%s' "$OUT" > "$RUNNER_TEMP/riesgo.out"
          echo "RC=$RC" >> "$GITHUB_ENV"
          ENC=$(printf '%s' "$OUT" | tail -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          if [ "$RC" = 0 ]; then echo "::notice title=riesgo OK::$ENC"; else echo "::error title=riesgo RECHAZADO (exit $RC)::$ENC"; fi
      - name: Publicar check "riesgo" sobre el HEAD del PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "${HEAD_SHA:-}" ] || { echo "::error::sin HEAD del PR; no se publica"; exit 1; }
          if [ "${RC:-1}" = 0 ]; then CONC=success; TIT="riesgo: OK"; else CONC=failure; TIT="riesgo: RECHAZADO o sin veredicto"; fi
          RES=$(head -c 60000 "$RUNNER_TEMP/riesgo.out" 2>/dev/null || echo "sin salida")
          jq -n --arg sha "$HEAD_SHA" --arg c "$CONC" --arg t "$TIT" --arg s "$RES" \
            '{name:"riesgo", head_sha:$sha, status:"completed", conclusion:$c, output:{title:$t, summary:("```\n"+$s+"\n```")}}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input - --jq .html_url
          [ "$CONC" = success ]
