# Gates de AGENTS.md en un runner de GitHub: evidencia independiente de los dos
# agentes. El auditor puede citar estas corridas en vez de las salidas de Claude.
name: gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 evita el aviso de Node 20
env:
  PNPM_VERSION: 12.5.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: scripts/ci/run.sh verify pnpm verify
      - run: pnpm build
      # E1 · BL-11/§47: el contrato y el inventario versionados = regenerados
      - name: OpenAPI y DELIVERY regenerados sin diff
        run: pnpm docs:contract && git diff --exit-code docs/platform/openapi.json docs/platform/DELIVERY.md
      # E2 · BL-23: la matriz de §48 se genera de los tags [§48.N]; puntos sin test/estado o doc viejo → rojo
      - name: Matriz de aceptación §48 al día
        run: pnpm acceptance:check

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # B3: el pipeline de Asset corre con PostgreSQL + ffprobe/ffmpeg reales
      - name: PostgreSQL 16 (binarios; el cluster lo levanta pg-up.sh sin root) + ffmpeg
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-16 ffmpeg
          sudo systemctl stop postgresql || true
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: bash scripts/dev/pg-up.sh
      - run: scripts/ci/run.sh postgres npx vitest run -c vitest.platform.config.ts --reporter=default --reporter=json --outputFile.json=platform-results.json
      # E2 · BL-23: cada test etiquetado [§48.N] tiene que haber PASADO en esta corrida (un skip no cubre)
      - run: scripts/ci/run.sh acceptance pnpm acceptance:check --results platform-results.json
      - run: scripts/ci/run.sh bootstrap bash packages/platform-db/scripts/bootstrap-smoke.sh

  # E1 · §35: `docker compose up` reproducible, imágenes por digest y contrato S3 contra SeaweedFS (#22)
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: docker compose version && aws --version
      - run: scripts/ci/run.sh compose-smoke bash scripts/ci/compose-smoke.sh
      - name: logs del compose
        if: always()
        run: cat compose-smoke.log 2>/dev/null | tail -200 || true

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg && ffmpeg -version | head -1
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: scripts/ci/run.sh media npx vitest run -c vitest.media.config.ts

  e2e-m2c:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: pnpm build
      # El Chromium que baja Playwright no trae H.264: los MP4 de la experiencia
      # no cargan y la pantalla queda en LOADING. Se usa el Google Chrome que ya
      # viene en el runner (con codecs propietarios) vía TRUST_CHROMIUM_PATH.
      - name: Playwright 1.56.1 + Google Chrome del runner
        run: |
          npm i --no-save --prefix /tmp/pw @playwright/test@1.56.1
          /tmp/pw/node_modules/.bin/playwright install-deps chromium
          google-chrome --version
      - run: scripts/ci/run.sh e2e-m2c /tmp/pw/node_modules/.bin/playwright test -c playwright.config.ts e2e/experience.spec.ts e2e/builder.spec.ts --reporter=line
        env: { NODE_PATH: /tmp/pw/node_modules, TRUST_CHROMIUM_PATH: /usr/bin/google-chrome }

  # E3c · E2E de plataforma (§41, §47; ADR-063): hosts HTTPS distintos
  # (web/control/api.trust.test → 127.0.0.1) con un terminador TLS de test,
  # API en modo producción (cookie __Host-trust_session), Builder real y tres
  # logins por la UI. Evidencia como artifact con manifest validado (BL-29).
  e2e-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      E2E_API_URL: https://api.trust.test:8443
      E2E_CONTROL_URL: https://control.trust.test:8443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ffmpeg + PostgreSQL 16
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg postgresql-16
          sudo systemctl stop postgresql || true
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: bash scripts/dev/pg-up.sh
      # BL-30: NEXT_PUBLIC_* queda congelada en el build; el build estricto exige la API por https.
      - name: BL-30 · un build estricto sin URL o con http falla
        working-directory: apps/platform-web
        run: |
          if TRUST_BUILD_STRICT=1 npx next build > /tmp/sin-url.log 2>&1; then echo "::error::build estricto sin URL compiló"; exit 1; fi
          grep -q "BL-30" /tmp/sin-url.log && echo "OK: sin NEXT_PUBLIC_TRUST_API_URL falla"
          if TRUST_BUILD_STRICT=1 NEXT_PUBLIC_TRUST_API_URL=http://api.trust.test:8443 npx next build > /tmp/http.log 2>&1; then echo "::error::build estricto con http compiló"; exit 1; fi
          grep -q "tiene que ser https" /tmp/http.log && echo "OK: con http falla"
      - name: Build de platform-web (estricto) y del Builder para los hosts de test
        run: |
          (cd apps/platform-web && TRUST_BUILD_STRICT=1 NEXT_PUBLIC_TRUST_API_URL=$E2E_API_URL NEXT_PUBLIC_TRUST_BUILDER_URL=$E2E_CONTROL_URL npx next build)
          # apps/control sin cambios de código: solo la variable de entorno (ADR-063)
          (cd apps/control && NEXT_PUBLIC_TRUST_API_URL=$E2E_API_URL npx next build)
      - name: Playwright 1.56.1 + axe-core + Google Chrome del runner
        run: |
          npm i --no-save --prefix /tmp/pw @playwright/test@1.56.1 @axe-core/playwright@4.10.2
          /tmp/pw/node_modules/.bin/playwright install-deps chromium
          # el video de §47 lo graba el ffmpeg propio de Playwright (no el del sistema)
          /tmp/pw/node_modules/.bin/playwright install ffmpeg
          google-chrome --version
      - run: scripts/ci/run.sh e2e-platform /tmp/pw/node_modules/.bin/playwright test -c playwright.platform.config.ts
        env: { NODE_PATH: /tmp/pw/node_modules, TRUST_CHROMIUM_PATH: /usr/bin/google-chrome, E2E_WORKERS: '2' }
      # BL-23: cada test [E3-N] tiene que haber PASADO en el reporte de Playwright.
      - run: scripts/ci/run.sh acceptance-navegador pnpm acceptance:check --playwright-results test-results/e2e-platform-results.json
      - name: BL-29 · manifest de evidencia (build + validate)
        run: |
          node scripts/e2e-platform/manifest.mjs build --report test-results/e2e-platform-results.json --evidence test-results/e2e-platform-evidence --out e2e-platform-evidence
          scripts/ci/run.sh evidencia node scripts/e2e-platform/manifest.mjs validate e2e-platform-evidence
      - name: e2e-platform-evidence
        uses: actions/upload-artifact@v4
        with:
          name: e2e-platform-evidence
          path: e2e-platform-evidence/
          retention-days: 90
          if-no-files-found: error
      - name: trazas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-platform-traces
          path: |
            test-results/e2e-platform/
            test-results/e2e-platform-logs/
          retention-days: 14
          if-no-files-found: ignore

  mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # las mutaciones de B3 necesitan PostgreSQL real además de ffmpeg
      - name: ffmpeg + PostgreSQL 16
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg postgresql-16
          sudo systemctl stop postgresql || true
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: bash scripts/dev/pg-up.sh
      - run: python3 scripts/mutation-check.py --autoprueba
      - run: scripts/ci/run.sh mutaciones python3 scripts/mutation-check.py
      - name: el árbol queda limpio
        run: git diff --exit-code
