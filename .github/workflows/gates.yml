# Gates de AGENTS.md en un runner de GitHub: evidencia independiente de los dos
# agentes. El auditor puede citar estas corridas en vez de las salidas de Claude.
name: gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 evita el aviso de Node 20
env:
  PNPM_VERSION: 12.5.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # P-04: en pull_request el checkout es el merge sintético; el HEAD auditado va en cada anotación
  P04_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      # P-04 · FALLA PROVOCADA (commit temporal, se revierte antes del SHA final): prueba que la
      # anotación lleva entorno + cola sanitizada y que test-results/ sube como artifact
      - run: |
          scripts/ci/run.sh "verify-build (falla provocada P-04)" bash -c 'echo "Tests  1 failed"; echo "GITHUB_TOKEN=ghp_falso1234567890abcdefghijklmnop"; echo "Set-Cookie: __Host-trust_session=falsa; Path=/"; echo "FALLA PROVOCADA P-04: no es un bug"; exit 1'
      - run: scripts/ci/run.sh verify pnpm verify
      # BL-30: todo `next build` de platform-web exige la API por https (no hay bandera opt-in).
      # Este build se descarta: la URL es la de los hosts de test, no un despliegue.
      - run: scripts/ci/run.sh build pnpm build
        env: { NEXT_PUBLIC_TRUST_API_URL: 'https://api.trust.test:8443' }
      # E1 · BL-11/§47: el contrato y el inventario versionados = regenerados
      # Memoria de la colaboración: HANDOFF es una foto del presente, no un historial
      # P-01: HANDOFF ≤ 60 líneas, exactamente una pelota válida, sin marcadores
      # de conflicto; y el script de escritura pasa su prueba de dos escritores.
      - name: HANDOFF.md válido (P-01)
        run: scripts/ci/run.sh handoff-validar scripts/collab/handoff.sh validar docs/collab/HANDOFF.md
      - name: handoff.sh — dos escritores sobre remoto bare
        run: scripts/ci/run.sh handoff-test bash scripts/collab/handoff.test.sh
      # P-05: el control del trabajo paralelo pasa su prueba sobre remoto bare
      - name: paralelo.sh — laterales, rama en auditoría y HANDOFF sobre remoto bare
        run: scripts/ci/run.sh paralelo-test bash scripts/collab/paralelo.test.sh
      # P-04: anotaciones con entorno, sanitización, artifacts y política de fallas pasan su prueba
      - name: scripts/ci — run.sh, entorno, sanitizar, política de fallas
        run: scripts/ci/run.sh ci-test bash scripts/ci/run.test.sh
      - name: Política de fallas (P-04) — retries 0, umbrales = foto, sin .only ni skips en E2E
        run: scripts/ci/run.sh politica-fallas scripts/ci/politica-fallas.sh check
      - name: OpenAPI y DELIVERY regenerados sin diff
        run: scripts/ci/run.sh contrato bash -c 'pnpm docs:contract && git diff --exit-code docs/platform/openapi.json docs/platform/DELIVERY.md'
      # E2 · BL-23: la matriz de §48 se genera de los tags [§48.N]; puntos sin test/estado o doc viejo → rojo
      - name: Matriz de aceptación §48 al día
        run: scripts/ci/run.sh acceptance-matriz pnpm acceptance:check
      # P-02: PROGRESO.md se genera del manifiesto de entregables (sin red); manifiesto inválido o doc viejo → rojo
      - name: PROGRESO.md al día (P-02)
        run: scripts/ci/run.sh progreso pnpm progress:check
      # P-04: la falla fuera de un gate (setup) igual deja el entorno anotado; test-results/ sube siempre que falla
      - name: Entorno (falla fuera de un gate)
        if: failure()
        run: '[ -e "$RUNNER_TEMP/p04-anotado" ] || scripts/ci/entorno.sh --error "verify-build: falló fuera de un gate (ver el paso rojo)"'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verify-build-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # P-05: el chequeo de trabajo paralelo corre en .github/workflows/paralelo.yml con
  # pull_request_target, desde la revisión BASE: no desde el checkout del PR (Codex, P1).

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # B3: el pipeline de Asset corre con PostgreSQL + ffprobe/ffmpeg reales
      - name: PostgreSQL 16 (binarios; el cluster lo levanta pg-up.sh sin root) + ffmpeg
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-16 ffmpeg
          sudo systemctl stop postgresql || true
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: bash scripts/dev/pg-up.sh
      # P-04 · FALLA PROVOCADA (commit temporal, se revierte antes del SHA final): prueba que la
      # anotación lleva entorno + cola sanitizada y que test-results/ sube como artifact
      - run: |
          scripts/ci/run.sh "postgres (falla provocada P-04)" bash -c 'echo "Tests  1 failed"; echo "GITHUB_TOKEN=ghp_falso1234567890abcdefghijklmnop"; echo "Set-Cookie: __Host-trust_session=falsa; Path=/"; echo "FALLA PROVOCADA P-04: no es un bug"; exit 1'
      - run: scripts/ci/run.sh postgres npx vitest run -c vitest.platform.config.ts --reporter=default --reporter=json --outputFile.json=platform-results.json
      # E2 · BL-23: cada test etiquetado [§48.N] tiene que haber PASADO en esta corrida (un skip no cubre)
      - run: scripts/ci/run.sh acceptance pnpm acceptance:check --results platform-results.json
      - run: scripts/ci/run.sh bootstrap bash packages/platform-db/scripts/bootstrap-smoke.sh
      # P-04: la falla fuera de un gate (setup) igual deja el entorno anotado; test-results/ sube siempre que falla
      - name: Entorno (falla fuera de un gate)
        if: failure()
        run: '[ -e "$RUNNER_TEMP/p04-anotado" ] || scripts/ci/entorno.sh --error "postgres: falló fuera de un gate (ver el paso rojo)"'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: postgres-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # E1 · §35: `docker compose up` reproducible, imágenes por digest y contrato S3 contra SeaweedFS (#22)
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: docker compose version && aws --version
      # P-04 · FALLA PROVOCADA (commit temporal, se revierte antes del SHA final): prueba que la
      # anotación lleva entorno + cola sanitizada y que test-results/ sube como artifact
      - run: |
          scripts/ci/run.sh "compose-smoke (falla provocada P-04)" bash -c 'echo "Tests  1 failed"; echo "GITHUB_TOKEN=ghp_falso1234567890abcdefghijklmnop"; echo "Set-Cookie: __Host-trust_session=falsa; Path=/"; echo "FALLA PROVOCADA P-04: no es un bug"; exit 1'
      - run: scripts/ci/run.sh compose-smoke bash scripts/ci/compose-smoke.sh
      - name: logs del compose
        if: always()
        run: cat compose-smoke.log 2>/dev/null | tail -200 || true
      # P-04: la falla fuera de un gate (setup) igual deja el entorno anotado; test-results/ sube siempre que falla
      - name: Entorno (falla fuera de un gate)
        if: failure()
        run: '[ -e "$RUNNER_TEMP/p04-anotado" ] || scripts/ci/entorno.sh --error "compose-smoke: falló fuera de un gate (ver el paso rojo)"'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg && ffmpeg -version | head -1
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      # P-04 · FALLA PROVOCADA fuera de un gate (commit temporal): prueba el paso final de entorno
      - run: 'echo "FALLA PROVOCADA P-04 fuera de un gate (media)"; exit 1'
      - run: scripts/ci/run.sh media npx vitest run -c vitest.media.config.ts
      # P-04: la falla fuera de un gate (setup) igual deja el entorno anotado; test-results/ sube siempre que falla
      - name: Entorno (falla fuera de un gate)
        if: failure()
        run: '[ -e "$RUNNER_TEMP/p04-anotado" ] || scripts/ci/entorno.sh --error "media: falló fuera de un gate (ver el paso rojo)"'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: media-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-m2c:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      # M2C no usa platform-web (y su `next build` exige NEXT_PUBLIC_TRUST_API_URL, BL-30): se excluye
      # para no cambiar ni una variable del build de apps/control congelado.
      - run: scripts/ci/run.sh build pnpm -r --filter '!@trust/platform-web' build
      # El Chromium que baja Playwright no trae H.264: los MP4 de la experiencia
      # no cargan y la pantalla queda en LOADING. Se usa el Google Chrome que ya
      # viene en el runner (con codecs propietarios) vía TRUST_CHROMIUM_PATH.
      - name: Playwright 1.56.1 + Google Chrome del runner
        run: |
          npm i --no-save --prefix /tmp/pw @playwright/test@1.56.1
          /tmp/pw/node_modules/.bin/playwright install-deps chromium
          google-chrome --version
      # Issue #26 / BL-09 / P-04: versiones y entorno para correlacionar fallas intermitentes
      - name: Entorno del runner
        run: scripts/ci/entorno.sh
      # P-04 · FALLA PROVOCADA (commit temporal, se revierte antes del SHA final): prueba que la
      # anotación lleva entorno + cola sanitizada y que test-results/ sube como artifact
      - run: |
          scripts/ci/run.sh "e2e-m2c (falla provocada P-04)" bash -c 'echo "Tests  1 failed"; echo "GITHUB_TOKEN=ghp_falso1234567890abcdefghijklmnop"; echo "Set-Cookie: __Host-trust_session=falsa; Path=/"; echo "FALLA PROVOCADA P-04: no es un bug"; exit 1'
      - run: scripts/ci/run.sh e2e-m2c /tmp/pw/node_modules/.bin/playwright test -c playwright.config.ts e2e/experience.spec.ts e2e/builder.spec.ts --reporter=line
        env: { NODE_PATH: /tmp/pw/node_modules, TRUST_CHROMIUM_PATH: /usr/bin/google-chrome }
      # Issue #26 / BL-09: el trace ya se retiene al fallar (playwright.config.ts);
      # sin esto se tira. El job sigue en rojo: upload-artifact no cambia el exit.
      - name: Entorno (falla fuera de un gate)
        if: failure()
        run: '[ -e "$RUNNER_TEMP/p04-anotado" ] || scripts/ci/entorno.sh --error "e2e-m2c: falló fuera de un gate (ver el paso rojo)"'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-m2c-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

  # E3c · E2E de plataforma (§41, §47; ADR-063): hosts HTTPS distintos
  # (web/control/api.trust.test → 127.0.0.1) con un terminador TLS de test,
  # API en modo producción (cookie __Host-trust_session), Builder real y tres
  # logins por la UI. Evidencia como artifact con manifest validado (BL-29).
  e2e-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      E2E_API_URL: https://api.trust.test:8443
      E2E_CONTROL_URL: https://control.trust.test:8443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ffmpeg + PostgreSQL 16
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg postgresql-16
          sudo systemctl stop postgresql || true
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: bash scripts/dev/pg-up.sh
      # BL-30: NEXT_PUBLIC_* queda congelada en el build; el build estricto exige la API por https.
      - name: BL-30 · `next build` sin URL o con http falla (el mismo comando de siempre, sin banderas)
        working-directory: apps/platform-web
        run: |
          # cada negativo tiene que fallar POR BL-30 (no por otro error de build): si falta el mensaje, el paso falla
          if env -u NEXT_PUBLIC_TRUST_API_URL -u NEXT_PUBLIC_TRUST_BUILDER_URL npx next build > /tmp/sin-url.log 2>&1; then echo "::error::next build sin URL compiló"; exit 1; fi
          grep -q "NEXT_PUBLIC_TRUST_API_URL es obligatoria" /tmp/sin-url.log || { cat /tmp/sin-url.log; echo "::error::el build sin URL falló por otro motivo"; exit 1; }
          echo "OK: next build sin NEXT_PUBLIC_TRUST_API_URL falla por BL-30"
          if NEXT_PUBLIC_TRUST_API_URL=http://api.trust.test:8443 npx next build > /tmp/http.log 2>&1; then echo "::error::next build con http compiló"; exit 1; fi
          grep -q "tiene que ser https" /tmp/http.log || { cat /tmp/http.log; echo "::error::el build con http falló por otro motivo"; exit 1; }
          echo "OK: next build con http falla por BL-30"
      - name: Build de platform-web y del Builder para los hosts de test
        run: |
          (cd apps/platform-web && NEXT_PUBLIC_TRUST_API_URL=$E2E_API_URL NEXT_PUBLIC_TRUST_BUILDER_URL=$E2E_CONTROL_URL npx next build)
          # apps/control sin cambios de código: solo la variable de entorno (ADR-063)
          (cd apps/control && NEXT_PUBLIC_TRUST_API_URL=$E2E_API_URL npx next build)
      - name: Playwright 1.56.1 + axe-core + Google Chrome del runner
        run: |
          npm i --no-save --prefix /tmp/pw @playwright/test@1.56.1 @axe-core/playwright@4.10.2
          /tmp/pw/node_modules/.bin/playwright install-deps chromium
          # el video de §47 lo graba el ffmpeg propio de Playwright (no el del sistema)
          /tmp/pw/node_modules/.bin/playwright install ffmpeg
          google-chrome --version
      # P-04 · FALLA PROVOCADA (commit temporal, se revierte antes del SHA final): prueba que la
      # anotación lleva entorno + cola sanitizada y que test-results/ sube como artifact
      - run: |
          scripts/ci/run.sh "e2e-platform (falla provocada P-04)" bash -c 'echo "Tests  1 failed"; echo "GITHUB_TOKEN=ghp_falso1234567890abcdefghijklmnop"; echo "Set-Cookie: __Host-trust_session=falsa; Path=/"; echo "FALLA PROVOCADA P-04: no es un bug"; exit 1'
      - run: scripts/ci/run.sh e2e-platform /tmp/pw/node_modules/.bin/playwright test -c playwright.platform.config.ts
        env: { NODE_PATH: /tmp/pw/node_modules, TRUST_CHROMIUM_PATH: /usr/bin/google-chrome, E2E_WORKERS: '2' }
      # BL-23: cada test [E3-N] tiene que haber PASADO en el reporte de Playwright.
      - run: scripts/ci/run.sh acceptance-navegador pnpm acceptance:check --playwright-results test-results/e2e-platform-results.json
      - name: BL-29 · manifest de evidencia (build + validate)
        # en pull_request, GITHUB_SHA es el merge commit sintético: el HEAD auditado va aparte
        env: { E2E_HEAD_SHA: '${{ github.event.pull_request.head.sha || github.sha }}' }
        run: |
          node scripts/e2e-platform/manifest.mjs build --report test-results/e2e-platform-results.json --evidence test-results/e2e-platform-evidence --out e2e-platform-evidence
          scripts/ci/run.sh evidencia node scripts/e2e-platform/manifest.mjs validate e2e-platform-evidence
      - name: e2e-platform-evidence
        uses: actions/upload-artifact@v4
        with:
          name: e2e-platform-evidence
          path: e2e-platform-evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Entorno (falla fuera de un gate)
        if: failure()
        run: '[ -e "$RUNNER_TEMP/p04-anotado" ] || scripts/ci/entorno.sh --error "e2e-platform: falló fuera de un gate (ver el paso rojo)"'
      # P-04: las trazas de Playwright (zip) no se reescriben: solo contienen sesiones de la instancia
      # de test que muere con el runner; test-results/ci/ lleva los logs de los gates ya sanitizados
      - name: trazas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-platform-traces-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/e2e-platform/
            test-results/e2e-platform-logs/
            test-results/ci/
          retention-days: 14
          if-no-files-found: ignore

  mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # las mutaciones de B3 necesitan PostgreSQL real además de ffmpeg
      - name: ffmpeg + PostgreSQL 16
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg postgresql-16
          sudo systemctl stop postgresql || true
      - run: npm i -g pnpm@$PNPM_VERSION && pnpm install --frozen-lockfile
      - run: bash scripts/dev/pg-up.sh
      # P-04 · FALLA PROVOCADA (commit temporal, se revierte antes del SHA final): prueba que la
      # anotación lleva entorno + cola sanitizada y que test-results/ sube como artifact
      - run: |
          scripts/ci/run.sh "mutations (falla provocada P-04)" bash -c 'echo "Tests  1 failed"; echo "GITHUB_TOKEN=ghp_falso1234567890abcdefghijklmnop"; echo "Set-Cookie: __Host-trust_session=falsa; Path=/"; echo "FALLA PROVOCADA P-04: no es un bug"; exit 1'
      - run: scripts/ci/run.sh autoprueba python3 scripts/mutation-check.py --autoprueba
      - run: scripts/ci/run.sh mutaciones python3 scripts/mutation-check.py
      - name: el árbol queda limpio
        run: scripts/ci/run.sh arbol-limpio git diff --exit-code
      # P-04: la falla fuera de un gate (setup) igual deja el entorno anotado; test-results/ sube siempre que falla
      - name: Entorno (falla fuera de un gate)
        if: failure()
        run: '[ -e "$RUNNER_TEMP/p04-anotado" ] || scripts/ci/entorno.sh --error "mutations: falló fuera de un gate (ver el paso rojo)"'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mutations-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
