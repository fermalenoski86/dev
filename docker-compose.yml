# M3A.1 §35 — desarrollo y CI. Valores de ejemplo, sin secretos reales.
# `docker compose up` (postgres + platform-api, storage local) lo verifica en
# CI el job compose-smoke (scripts/ci/compose-smoke.sh). Las imágenes van
# fijadas por digest.
#
# S3 de desarrollo/CI: SeaweedFS (decisión de Fer en #22; MinIO ya no se
# distribuye sin login). Solo dev/CI: NO elige el proveedor de producción, que
# tiene que cumplir versioning + Object Lock (docs/ops/BACKUPS.md). Va detrás
# del perfil `s3`: `docker compose --profile s3 up` (el default usa storage
# local, como .env.example). compose-smoke corre el contrato S3 contra este
# servicio y platform-api con STORAGE_DRIVER=s3.
services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d   # 16.15 (Debian), digest resuelto en CI run 37839307934
    environment:
      POSTGRES_PASSWORD: CHANGE_ME
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  seaweedfs:
    profiles: ["s3"]
    # resuelto de chrislusf/seaweedfs:latest en CI (run 37839307934); la versión la imprime compose-smoke
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes: ["./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"]
    ports: ["9000:8333"]   # S3 en 127.0.0.1:9000, el S3_ENDPOINT de .env.example

  platform-api:
    image: node:22-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8   # digest resuelto en CI run 37839307934
    working_dir: /repo
    volumes: [".:/repo"]
    # ffmpeg/ffprobe del sistema; pnpm fijado como en AGENTS.md
    command: sh -c "apt-get update -q && apt-get install -yq ffmpeg && npm i -g pnpm@12.5.1 && pnpm install --frozen-lockfile && pnpm --filter @trust/platform-api start"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
