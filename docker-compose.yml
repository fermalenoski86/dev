# M3A.1 Fase B §35 — preparado para CI/desarrollo. NO EJECUTADO en el entorno
# de los agentes (no hay Docker). Valores de ejemplo, sin secretos reales.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: CHANGE_ME
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest   # fijar digest antes de usarlo en CI (no verificado acá)
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: CHANGE_ME
      MINIO_ROOT_PASSWORD: CHANGE_ME_TOO
    ports: ["9000:9000", "9001:9001"]

  platform-api:
    image: node:22-bookworm
    working_dir: /repo
    volumes: [".:/repo"]
    # ffmpeg/ffprobe del sistema; pnpm fijado como en AGENTS.md
    command: sh -c "apt-get update -q && apt-get install -yq ffmpeg && npm i -g pnpm@12.5.1 && pnpm install --frozen-lockfile && pnpm --filter @trust/platform-api start"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
