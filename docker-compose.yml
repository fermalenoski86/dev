# M3A.1 §35 — desarrollo y CI. Valores de ejemplo, sin secretos reales.
# `docker compose up` (postgres + platform-api, storage local) lo verifica en
# CI el job compose-smoke (scripts/ci/compose-smoke.sh). Las imágenes van
# fijadas por digest.
#
# MinIO: la imagen minio/minio fue borrada de Docker Hub (sep-2026) y la de
# quay.io dejó de ser pública; la última build comunitaria además no recibe
# parches. Queda detrás del perfil `s3` hasta que Fer decida el reemplazo
# (issue #22, decisión-producto).
services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d   # 16.15 (Debian), digest resuelto en CI run 37839307934
    environment:
      POSTGRES_PASSWORD: CHANGE_ME
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  minio:
    profiles: ["s3"]   # NO arranca con `docker compose up`: imagen no disponible (ver arriba)
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: CHANGE_ME
      MINIO_ROOT_PASSWORD: CHANGE_ME_TOO
    ports: ["9000:9000", "9001:9001"]

  platform-api:
    image: node:22-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8   # digest resuelto en CI run 37839307934
    working_dir: /repo
    volumes: [".:/repo"]
    # ffmpeg/ffprobe del sistema; pnpm fijado como en AGENTS.md
    command: sh -c "apt-get update -q && apt-get install -yq ffmpeg && npm i -g pnpm@12.5.1 && pnpm install --frozen-lockfile && pnpm --filter @trust/platform-api start"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
